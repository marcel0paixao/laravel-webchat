x-app-env: &app-env
  APP_NAME: "Webchats"
  APP_ENV: local
  APP_DEBUG: "true"
  APP_URL: http://localhost:8080
  DEBUGBAR_ENABLED: "false"
  LOG_CHANNEL: stack
  LOG_LEVEL: debug
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: laravel_webchat
  DB_USERNAME: webchat
  DB_PASSWORD: webchat
  BROADCAST_DRIVER: pusher
  CACHE_DRIVER: redis
  FILESYSTEM_DISK: local
  CHAT_FILESYSTEM_DISK: minio
  QUEUE_CONNECTION: sync
  SESSION_DRIVER: redis
  SESSION_LIFETIME: "120"
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PASSWORD: "null"
  REDIS_PORT: "6379"
  MAIL_MAILER: log
  MAIL_HOST: localhost
  MAIL_PORT: "1025"
  MAIL_USERNAME: "null"
  MAIL_PASSWORD: "null"
  MAIL_ENCRYPTION: "null"
  MAIL_FROM_ADDRESS: hello@example.com
  MAIL_FROM_NAME: "Webchats"
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
  AWS_DEFAULT_REGION: us-east-1
  AWS_BUCKET: webchat
  AWS_ENDPOINT: http://minio:9000
  AWS_URL: http://localhost:9000/webchat
  AWS_USE_PATH_STYLE_ENDPOINT: "true"
  PUSHER_APP_ID: local-webchat
  PUSHER_APP_KEY: local-webchat-key
  PUSHER_APP_SECRET: local-webchat-secret
  PUSHER_HOST: websockets
  PUSHER_PORT: "6001"
  PUSHER_SCHEME: http
  PUSHER_APP_CLUSTER: mt1
  MIX_PUSHER_APP_KEY: local-webchat-key
  MIX_PUSHER_APP_CLUSTER: mt1
  SMS_PROVIDER: log

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel-webchat-app
    restart: unless-stopped
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "true"
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "php", "artisan", "--version"]
      interval: 30s
      timeout: 5s
      retries: 8

  web:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  websockets:
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel-webchat-app
    restart: unless-stopped
    command: php artisan websockets:serve --host=0.0.0.0 --port=6001
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "false"
    ports:
      - "6001:6001"
    volumes:
      - ./:/var/www/html
    depends_on:
      app:
        condition: service_healthy

  node:
    image: node:18-alpine
    working_dir: /var/www/html
    command: sh -lc "if [ ! -d node_modules/.bin ]; then npm ci; fi && npm run development && tail -f /dev/null"
    environment:
      <<: *app-env
    volumes:
      - ./:/var/www/html
      - node-modules:/var/www/html/node_modules

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laravel_webchat
      MYSQL_USER: webchat
      MYSQL_PASSWORD: webchat
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 20s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-create-bucket:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "sleep 5;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/webchat || true;
      mc anonymous set download local/webchat || true;"

volumes:
  mysql-data:
  minio-data:
  node-modules:
